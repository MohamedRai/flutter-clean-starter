name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  quality:
    name: Format · codegen · analyze · test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Create env files from examples
        run: for f in dev staging prod; do cp env/$f.example.json env/$f.json; done

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed lib test integration_test tool

      - name: Check generated code is up to date
        run: |
          flutter gen-l10n
          dart run build_runner build
          git diff --exit-code -- lib || {
            echo "::error::Generated code is stale. Run 'make gen' and commit the result."
            exit 1
          }

      - name: Analyze
        run: flutter analyze

      - name: Test with coverage
        run: flutter test --coverage

      - name: Coverage gate (features domain + data ≥ 80 %)
        run: dart run tool/coverage.dart --min 80

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  build-android:
    name: Build Android (${{ matrix.flavor }})
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        flavor: [dev, staging, prod]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: cp env/${{ matrix.flavor }}.example.json env/${{ matrix.flavor }}.json

      - name: Build APK
        run: >
          flutter build apk --debug
          --flavor ${{ matrix.flavor }}
          -t lib/main_${{ matrix.flavor }}.dart
          --dart-define-from-file=env/${{ matrix.flavor }}.json
