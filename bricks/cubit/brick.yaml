name: cubit
description: "A Cubit with a sealed state (Equatable) plus a bloc_test file."
version: 0.1.0+1

environment:
  mason: ^0.1.0

vars:
  feature:
    type: string
    description: Feature folder, snake_case (e.g. orders)
    default: orders
    prompt: Which feature (folder under lib/features)?

  name:
    type: string
    description: Cubit name without suffix (e.g. order_form)
    default: item_form
    prompt: Cubit name?
