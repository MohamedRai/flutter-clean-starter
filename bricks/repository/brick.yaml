name: repository
description: "A repository contract (domain) and its implementation (data) on BaseRepository, with a test."
version: 0.1.0+1

environment:
  mason: ^0.1.0

vars:
  feature:
    type: string
    description: Feature folder, snake_case (e.g. orders)
    default: orders
    prompt: Which feature (folder under lib/features)?

  name:
    type: string
    description: Entity the repository serves (e.g. customer)
    default: customer
    prompt: Entity name?
